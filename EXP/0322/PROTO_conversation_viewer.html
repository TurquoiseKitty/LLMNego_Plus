<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NegoLib Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f0f11;
    --surface:   #18181c;
    --surface2:  #212128;
    --border:    #2e2e38;
    --text:      #e8e8f0;
    --muted:     #7070a0;
    --merchant:  #4ade9a;
    --supplier:  #60a5fa;
    --judge:     #f59e0b;
    --system:    #a78bfa;
    --reasoning: #2a2a18;
    --reasoning-border: #4a4a20;
    --reasoning-text: #c4c47a;
    --accent:    #4ade9a;
  }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--surface);
  }
  header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--accent);
  }
  header span {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ── Layout ── */
  .layout {
    display: flex;
    flex: 1;
    height: calc(100vh - 57px);
  }

  /* ── Input panel ── */
  .input-panel {
    width: 340px;
    min-width: 260px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }
  .input-panel h2 {
    font-size: 0.7rem;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.12em;
    color: var(--muted);
    padding: 1rem 1.25rem 0.75rem;
    text-transform: uppercase;
  }
  textarea {
    flex: 1;
    background: var(--bg);
    border: none;
    border-top: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    line-height: 1.6;
    padding: 1rem 1.25rem;
    resize: none;
    outline: none;
  }
  textarea::placeholder { color: var(--muted); }
  .parse-btn {
    margin: 1rem;
    padding: 0.65rem 1rem;
    background: var(--accent);
    color: #0a1a12;
    border: none;
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .parse-btn:hover { opacity: 0.85; }

  /* ── Viewer panel ── */
  .viewer-panel {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    line-height: 2;
  }

  /* ── Repeat block ── */
  .repeat-block {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .repeat-header {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.75rem;
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  .repeat-header .tag {
    display: flex;
    gap: 0.4em;
  }
  .repeat-header .tag-key { color: var(--muted); }
  .repeat-header .tag-val { color: var(--text); }

  /* ── Round label ── */
  .round-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 1rem 0 0.5rem;
  }

  /* ── Message bubble ── */
  .message {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
  }
  .message.merchant { align-items: flex-start; }
  .message.supplier { align-items: flex-end; }
  .message.judge    { align-items: center; }
  .message.system   { align-items: center; }

  .speaker-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0 0.25rem;
  }
  .merchant .speaker-tag { color: var(--merchant); }
  .supplier .speaker-tag { color: var(--supplier); }
  .judge    .speaker-tag { color: var(--judge); }
  .system   .speaker-tag { color: var(--system); }

  .bubble {
    max-width: 72%;
    padding: 0.75rem 1rem;
    border-radius: 10px;
    font-size: 0.85rem;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid transparent;
  }
  .merchant .bubble {
    background: #0d2a1e;
    border-color: #1a4a30;
    border-radius: 4px 14px 14px 14px;
  }
  .supplier .bubble {
    background: #0d1e30;
    border-color: #1a3050;
    border-radius: 14px 4px 14px 14px;
  }
  .judge .bubble {
    background: var(--surface2);
    border-color: #3a3010;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    max-width: 88%;
    border-radius: 8px;
  }
  .system .bubble {
    background: #1a1428;
    border-color: #2e2050;
    font-size: 0.78rem;
    font-style: italic;
    color: var(--system);
    max-width: 88%;
    border-radius: 8px;
  }

  /* deal closed highlight */
  .judge.deal-closed .bubble {
    border-color: var(--accent);
    background: #0d2010;
  }

  /* ── Reasoning toggle ── */
  .reasoning-toggle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.2rem 0.6rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    align-self: flex-start;
  }
  .message.supplier .reasoning-toggle { align-self: flex-end; }
  .reasoning-toggle:hover { border-color: var(--reasoning-border); color: var(--reasoning-text); }

  .reasoning-block {
    background: var(--reasoning);
    border: 1px solid var(--reasoning-border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    line-height: 1.7;
    color: var(--reasoning-text);
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 80%;
    display: none;
  }
  .message.supplier .reasoning-block { align-self: flex-end; }
  .reasoning-block.open { display: block; }

  /* ── Result badge ── */
  .result-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    margin-top: 0.25rem;
    display: inline-block;
    align-self: center;
  }
  .result-badge.deal { background: #0d2a1e; color: var(--merchant); border: 1px solid #1a4a30; }
  .result-badge.fail { background: #2a0d0d; color: #f87171; border: 1px solid #4a1a1a; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>NegoLib // Conversation Viewer</h1>
  <span>paste raw output → parse → inspect</span>
</header>

<div class="layout">
  <div class="input-panel">
    <h2>Raw output</h2>
    <textarea id="raw-input" placeholder="Paste the printed negotiation log here..."></textarea>
    <button class="parse-btn" onclick="parse()">Parse →</button>
  </div>

  <div class="viewer-panel" id="viewer">
    <div class="empty-state">
      Paste a negotiation log on the left<br>and press Parse to render it here.
    </div>
  </div>
</div>

<script>
function parse() {
  const raw = document.getElementById('raw-input').value;
  const viewer = document.getElementById('viewer');
  viewer.innerHTML = '';

  // Split into repeat blocks
  const repeatSections = raw.split(/={50,}/).map(s => s.trim()).filter(Boolean);

  if (!repeatSections.length) {
    viewer.innerHTML = '<div class="empty-state">Nothing to parse.</div>';
    return;
  }

  repeatSections.forEach(section => {
    const block = document.createElement('div');
    block.className = 'repeat-block';

    // Parse header lines
    const lines = section.split('\n');
    const headerLines = [];
    let bodyStart = 0;
    for (let i = 0; i < Math.min(6, lines.length); i++) {
      if (lines[i].startsWith('REPEAT') || lines[i].startsWith('Scenario') ||
          lines[i].startsWith('Merchant') || lines[i].startsWith('Supplier')) {
        headerLines.push(lines[i]);
        bodyStart = i + 1;
      }
    }

    // Render header
    if (headerLines.length) {
      const hdr = document.createElement('div');
      hdr.className = 'repeat-header';
      headerLines.forEach(hl => {
        const tag = document.createElement('span');
        tag.className = 'tag';
        const colonIdx = hl.indexOf(':');
        if (colonIdx > -1) {
          tag.innerHTML = `<span class="tag-key">${hl.slice(0, colonIdx)}</span><span class="tag-val">${hl.slice(colonIdx)}</span>`;
        } else {
          tag.innerHTML = `<span class="tag-val">${hl}</span>`;
        }
        hdr.appendChild(tag);
      });
      block.appendChild(hdr);
    }

    // Parse body into rounds and messages
    const body = lines.slice(bodyStart).join('\n');

    // Split into rounds
    const roundChunks = body.split(/(?=--- Round \d+)/);

    roundChunks.forEach(chunk => {
      chunk = chunk.trim();
      if (!chunk) return;

      // Round label
      const roundMatch = chunk.match(/^--- Round (\d+) ---/);
      if (roundMatch) {
        const rl = document.createElement('div');
        rl.className = 'round-label';
        rl.textContent = `Round ${roundMatch[1]}`;
        block.appendChild(rl);
        chunk = chunk.replace(/^--- Round \d+ ---\n?/, '');
      }

      // Split chunk into speaker segments
      // Each segment starts with [SPEAKER] or [SPEAKER reasoning]
      const segments = parseSegments(chunk);
      segments.forEach(seg => block.appendChild(renderMessage(seg)));
    });

    // Result badge
    const dealMatch = section.match(/>> Repeat \d+: (DEAL CLOSED|NO DEAL[^\n]*)/);
    if (dealMatch) {
      const badge = document.createElement('div');
      badge.className = 'result-badge ' + (dealMatch[1].startsWith('DEAL') ? 'deal' : 'fail');
      badge.textContent = dealMatch[1];
      block.appendChild(badge);
    }

    viewer.appendChild(block);
  });
}

function parseSegments(text) {
  // Match [SPEAKER reasoning] or [SPEAKER]:
  const pattern = /\[([A-Z]+)(?: reasoning)?\](?::\s*)?/g;
  const segments = [];
  let match;
  const positions = [];

  while ((match = pattern.exec(text)) !== null) {
    positions.push({ index: match.index, end: match.index + match[0].length, speaker: match[1], isReasoning: match[0].includes('reasoning') });
  }

  for (let i = 0; i < positions.length; i++) {
    const pos = positions[i];
    const nextPos = positions[i + 1];
    const content = text.slice(pos.end, nextPos ? nextPos.index : text.length).trim();

    // Find or merge with previous segment of same speaker if this is reasoning
    if (pos.isReasoning) {
      if (segments.length && segments[segments.length - 1].speaker === pos.speaker) {
        segments[segments.length - 1].reasoning = content;
      } else {
        segments.push({ speaker: pos.speaker, content: '', reasoning: content });
      }
    } else {
      // Check if next segment is reasoning for same speaker — will be merged there
      segments.push({ speaker: pos.speaker, content, reasoning: null });
    }
  }

  // Second pass: attach reasoning to the message before it
  const merged = [];
  for (let i = 0; i < segments.length; i++) {
    const seg = segments[i];
    if (seg.reasoning !== null && seg.content === '' && merged.length && merged[merged.length-1].speaker === seg.speaker) {
      merged[merged.length-1].reasoning = seg.reasoning;
    } else {
      merged.push(seg);
    }
  }

  return merged;
}

function renderMessage(seg) {
  const speakerLower = seg.speaker.toLowerCase();
  const div = document.createElement('div');
  div.className = 'message ' + speakerLower;

  // Check if judge message indicates deal closed
  if (speakerLower === 'judge' && seg.content.includes('DEAL_CLOSED')) {
    div.classList.add('deal-closed');
  }

  // Speaker tag
  const tag = document.createElement('div');
  tag.className = 'speaker-tag';
  tag.textContent = seg.speaker;
  div.appendChild(tag);

  // Reasoning toggle + block (if present)
  if (seg.reasoning) {
    const toggle = document.createElement('button');
    toggle.className = 'reasoning-toggle';
    toggle.textContent = '▶ thinking';

    const rBlock = document.createElement('div');
    rBlock.className = 'reasoning-block';
    rBlock.textContent = seg.reasoning;

    toggle.addEventListener('click', () => {
      rBlock.classList.toggle('open');
      toggle.textContent = rBlock.classList.contains('open') ? '▼ thinking' : '▶ thinking';
    });

    div.appendChild(toggle);
    div.appendChild(rBlock);
  }

  // Message bubble
  if (seg.content) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = seg.content;
    div.appendChild(bubble);
  }

  return div;
}
</script>
</body>
</html>
